[package]
name = "pdfpro"
version = "1.0.0"
edition = "2021"
description = "PDF 阅读器：阅读 · 标注 · 编辑文字 · 页面管理"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"   # 体积优先
lto = true
codegen-units = 1
strip = true
